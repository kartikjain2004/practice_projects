<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <aside class="sidebar">

        <div class="logo">W</div>

        <nav class="nav-menu">

            <button class="new-item">▦</button>
            <button class="new-item">⌖</button>
            <button class="new-item">☁</button>
            <button class="new-item">ϟ</button>
            <button class="new-item">⚙</button>

        </nav>

    </aside>

    <main class="main-content">

        <header class="topbar">

            <div class="search-box">

                <span>Q</span>

                <input 
                    type="text" 
                    id="city-input" 
                    placeholder="Search City"
                >

                <button class="search-button">Search</button>
                
                
            </div>
            <div class="my-location-div"> 
                <button class="my-location">
                Use my location
                </button>
            </div>

        </header>

        <!-- DashBoard Grid -->
        <div class="dashboard-grid">
            
            <!-- Left Column -->
            <div class="left-column">

                <!-- Current Weather -->
                <section class="weather-card" id="current-weather">

                    <div class="weather-top">

                        <span class="city-name">Search a City</span>

                        <div class="unit-toggle">
                            <button id="fahrenheit-btn">°F</button>
                            <button id="fahrenheit-btn" class="selected">°C</button>
                        </div>

                    </div>

                    <div class="weather-main">
                        <h2>Weather</h2>
                        <p id="weather-condition">--</p>
                        <h1 id="temperature">--°</h1>
                        <p id="feels-like">Feels like --°</p>
                    </div>

                    <div class="weather-illustration" id="weather-icon">
                        XX
                    </div>

                    <div class="temperature-range">
                        <span id="high-temp">High: --°</span>
                        <span id="low-temp">Low: --°</span>
                    </div>

                 </section>

                <!-- Forecast -->
                <section class="forecast-card">

                    <h2>Today</h2>

                    <div class="hourly-container" id="hourly-container"></div>

                    <div class="sun-info">

                        <div>
                            Sunrise <br>
                            <span id="sunrise">--</span>
                        </div>

                        <div>
                            Sunset <br>
                            <span id="sunset">--</span>
                        </div>

                        <div>
                            Day Length <br>
                            <span id="day-length">--</span>
                        </div>

                    </div>

                </section>

            </div>

            <!-- Right Column -->
            <div class="right-column">

                <!-- Highlights -->
                <section class="highlights-card">
                    
                    <h2>Today's Highlight</h2>
                
                    <div class="highlights-grid">

                        <div class="highlight-item">
                            <h3>Chances of Rain</h3>
                            <p id="rain-chance">--%</p>
                        </div>

                        <div class="highlight-item">
                            <h3>UV Index</h3>
                            <p id="uv-index">--</p>
                        </div>

                        <div class="highlight-item">
                            <h3>Wind Status</h3>
                            <p id="wind-speed">-- km/h</p>
                        </div>

                        <div class="highlight-item">
                            <h3>Humidity</h3>
                            <p id="humidity">--%</p>
                        </div>

                    </div>

                </section>
                
                <!-- Other Cities -->
                 <section class="other-citites">

                    <h2>Other Cities</h2>

                    <div id="cities-container">
                        <!-- Favourite Cities will appear here -->
                         <div>fddffd</div>
                         <div>dfdff</div>
                    </div>

                 </section>
                
            </div>

        </div>
        
    </main>

    <script type="module" src="/src/js/main.js"></script>

</body>
</html>
